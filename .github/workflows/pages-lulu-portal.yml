name: Deploy Lulu's Portal Adventure to Pages

on:
  push:
    branches: [ claude/lulu-portal-game-deploy-jdib51 ]
    paths:
      - lulu-piggy-portal.html
      - lulu-photo.jpg
      - .github/workflows/pages-lulu-portal.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp lulu-piggy-portal.html _site/lulu-piggy-portal.html
          cp lulu-photo.jpg _site/lulu-photo.jpg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
